<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { Mascotinho } from './mascotinho.js';

const SUPABASE_URL = "https://uxuplzjsmoilzrobiflh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1mKkxDpM7WJvFm1xGVXxBA_5o1x6m9e";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const moodEmoji = { happy:'😊', tired:'🥱', sad:'😢', mad:'😠', hungry:'🍙', sleepy:'😴', excited:'🤩', naughty:'😏' };
const moodLabel = { happy:'Feliz', tired:'Cansado(a)', sad:'Triste', mad:'Com raiva', hungry:'Com fome', sleepy:'Com sono', excited:'Animado(a)', naughty:'Travesso(a)' };

let myUserId = null;
let myProfile = null;
let partnerProfile = null;
let selectedDelivery = 'immediate';

/* ---------------- tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ---------------- write form ---------------- */
document.querySelectorAll('.delivery-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.delivery-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedDelivery = btn.dataset.delivery;
    document.getElementById('deliveryDateField').style.display = selectedDelivery === 'date' ? '' : 'none';
    document.getElementById('deliveryMoodField').style.display = selectedDelivery === 'mood' ? '' : 'none';
  });
});

document.getElementById('letterSaveBtn').addEventListener('click', async () => {
  const content = document.getElementById('letterContent').value.trim();
  const hint = document.getElementById('letterHint');
  const btn = document.getElementById('letterSaveBtn');

  if (!content) { hint.textContent = 'Escreve algo antes de selar 💭'; return; }
  if (!partnerProfile) { hint.textContent = 'Seu par ainda não entrou no app 💭'; return; }

  const payload = {
    pair_id: myProfile.pair_id,
    from_user_id: myUserId,
    to_user_id: partnerProfile.user_id,
    content,
    delivery_type: selectedDelivery,
    delivery_date: selectedDelivery === 'date' ? document.getElementById('letterDate').value || null : null,
    delivery_time: selectedDelivery === 'date' ? document.getElementById('letterTime').value || null : null,
    delivery_mood: selectedDelivery === 'mood' ? document.getElementById('letterMood').value : null
  };

  if (selectedDelivery === 'date' && !payload.delivery_date) { hint.textContent = 'Escolhe uma data 💭'; return; }
  if (selectedDelivery === 'date' && !payload.delivery_time) { hint.textContent = 'Escolhe um horário 💭'; return; }

  btn.disabled = true;
  hint.textContent = 'Selando...';

  const { error } = await supabase.from('letters').insert(payload);
  btn.disabled = false;

  if (error) {
    console.error('ERRO AO SALVAR CARTA:', error);
    hint.textContent = 'Não foi possível salvar — tente de novo 🥺';
    return;
  }

  document.getElementById('letterContent').value = '';
  document.getElementById('letterTime').value = '';
  hint.textContent = 'Carta selada e enviada! 💌';
  setTimeout(() => hint.textContent = '', 3000);
  await loadSentLetters();
  Mascotinho.ganharXP('carta');
});

/* ---------------- inbox ---------------- */

// combina delivery_date + delivery_time num único momento local.
// delivery_time vem do Postgres tipo "HH:MM:SS"; cartas antigas sem horário caem à meia-noite.
function letterDeliveryMoment(letter) {
  if (letter.delivery_type !== 'date' || !letter.delivery_date) return null;
  const time = (letter.delivery_time || '00:00:00').slice(0, 5);
  return new Date(letter.delivery_date + 'T' + time + ':00');
}

function formatDateTime(moment) {
  return moment.toLocaleDateString('pt-BR') + ' às ' + moment.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

// texto tipo "2 dias, 5 horas, 10 minutos" até o momento informado
function formatCountdown(moment) {
  const diff = moment.getTime() - Date.now();
  if (diff <= 0) return null;
  const totalMinutes = Math.floor(diff / 60000);
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  const parts = [];
  if (days > 0) parts.push(days + (days === 1 ? ' dia' : ' dias'));
  if (days > 0 || hours > 0) parts.push(hours + (hours === 1 ? ' hora' : ' horas'));
  parts.push(minutes + (minutes === 1 ? ' minuto' : ' minutos'));
  return parts.join(', ');
}

function dateLockedLabel(moment) {
  const countdown = formatCountdown(moment);
  return '🗓️ abre em ' + formatDateTime(moment) + (countdown ? ' · faltam ' + countdown : '');
}

function deliveryConditionText(letter) {
  if (letter.delivery_type === 'immediate') return 'disponível a qualquer momento';
  if (letter.delivery_type === 'date') {
    const moment = letterDeliveryMoment(letter);
    return moment ? 'abre em ' + formatDateTime(moment) : '';
  }
  if (letter.delivery_type === 'mood') return 'abre quando você estiver ' + (moodLabel[letter.delivery_mood] || letter.delivery_mood).toLowerCase();
  return '';
}

function isLetterUnlocked(letter, myMood) {
  if (letter.delivery_type === 'immediate') return true;
  if (letter.delivery_type === 'date') {
    const moment = letterDeliveryMoment(letter);
    return !!moment && moment.getTime() <= Date.now();
  }
  if (letter.delivery_type === 'mood') return !!myMood && letter.delivery_mood === myMood;
  return false;
}

function lockedConditionText(letter) {
  if (letter.delivery_type === 'date') {
    const moment = letterDeliveryMoment(letter);
    return moment ? dateLockedLabel(moment) : '';
  }
  if (letter.delivery_type === 'mood') {
    return '💭 abre quando você estiver ' + (moodLabel[letter.delivery_mood] || letter.delivery_mood).toLowerCase();
  }
  return '';
}

/* ---------------- modal da carta (o "quadrado" com o conteúdo inteiro) ---------------- */
const letterModalOverlay = document.getElementById('letterModalOverlay');

function openLetterModal(letter, opened) {
  document.getElementById('letterModalBadge').textContent = opened ? '💌 carta aberta' : '💌 nova carta!';
  document.getElementById('letterModalCondition').textContent = deliveryConditionText(letter);
  document.getElementById('letterModalContent').textContent = letter.content;
  letterModalOverlay.classList.add('open');
}

function closeLetterModal() { letterModalOverlay.classList.remove('open'); }

document.getElementById('letterModalClose').addEventListener('click', closeLetterModal);
letterModalOverlay.addEventListener('click', (e) => {
  if (e.target === letterModalOverlay) closeLetterModal();
});

/* ---------------- contagem regressiva ao vivo das cartas trancadas por data ---------------- */
let inboxCountdownTimer = null;

function startInboxCountdownTimer() {
  if (inboxCountdownTimer) clearInterval(inboxCountdownTimer);
  inboxCountdownTimer = setInterval(() => {
    let needsReload = false;
    document.querySelectorAll('.letter-card.locked[data-delivery-moment]').forEach(card => {
      const moment = new Date(card.dataset.deliveryMoment);
      if (moment.getTime() <= Date.now()) { needsReload = true; return; }
      const conditionEl = card.querySelector('.letter-condition');
      if (conditionEl) conditionEl.textContent = dateLockedLabel(moment);
    });
    if (needsReload) loadInboxLetters();
  }, 30000);
}

async function loadInboxLetters() {
  const list = document.getElementById('inboxList');
  list.innerHTML = '<div class="letter-empty">Carregando... 💌</div>';

  // Agora a policy de select traz TODAS as cartas do destinatário,
  // trancadas ou não — o front decide o que mostrar (ver migração 0004).
  const { data, error } = await supabase.from('letters').select('*').eq('to_user_id', myUserId).order('created_at', { ascending: false });

  if (error) { console.error('ERRO AO CARREGAR CARTAS:', error); list.innerHTML = '<div class="letter-empty">Não foi possível carregar 😢</div>'; return; }

  const { data: myMoodRow } = await supabase.from('mood_state').select('mood').eq('user_id', myUserId).maybeSingle();
  const myMood = myMoodRow ? myMoodRow.mood : null;

  list.innerHTML = '';
  if (!data || !data.length) {
    list.innerHTML = '<div class="letter-empty">Nenhuma carta esperando por você agora 💭</div>';
    return;
  }

  const readyCount = data.filter(l => !l.opened_at && isLetterUnlocked(l, myMood)).length;
  if (readyCount > 0) {
    const banner = document.createElement('div');
    banner.className = 'letter-new-banner';
    banner.textContent = readyCount === 1
      ? '💌 Você tem uma carta esperando por você!'
      : '💌 Você tem ' + readyCount + ' cartas esperando por você!';
    list.appendChild(banner);
  }

  data.forEach(letter => {
    let opened = !!letter.opened_at;
    const unlocked = isLetterUnlocked(letter, myMood);

    const card = document.createElement('div');

    if (!unlocked) {
      card.className = 'letter-card locked';
      card.innerHTML =
        '<div class="letter-top"><span class="letter-badge"><span class="letter-lock-icon">🔒</span>carta selada</span></div>' +
        '<div class="letter-condition">' + lockedConditionText(letter) + '</div>';
      const moment = letterDeliveryMoment(letter);
      if (moment) card.dataset.deliveryMoment = moment.toISOString();
      list.appendChild(card);
      return;
    }

    const preview = letter.content.length > 90 ? letter.content.slice(0, 90) + '…' : letter.content;
    card.className = 'letter-card' + (!opened ? ' awaiting' : '');
    card.innerHTML =
      '<div class="letter-top"><span class="letter-badge">' + (opened ? '💌 carta aberta' : '💌 nova carta!') + '</span></div>' +
      '<div class="letter-preview' + (opened ? '' : ' blurred') + '">' + escapeHtml(preview) + '</div>' +
      '<p class="letter-condition">' + (opened ? 'toque pra ler de novo 👆' : 'toque pra abrir 👆') + '</p>';

    card.addEventListener('click', async () => {
      openLetterModal(letter, opened);
      if (!opened) {
        opened = true;
        card.classList.remove('awaiting');
        card.querySelector('.letter-badge').textContent = '💌 carta aberta';
        card.querySelector('.letter-preview').classList.remove('blurred');
        card.querySelector('.letter-condition').textContent = 'toque pra ler de novo 👆';
        await supabase.from('letters').update({ opened_at: new Date().toISOString() }).eq('id', letter.id);
      }
    });

    list.appendChild(card);
  });

  startInboxCountdownTimer();
}

/* ---------------- sent ---------------- */
async function loadSentLetters() {
  const list = document.getElementById('sentList');
  list.innerHTML = '<div class="letter-empty">Carregando... 📤</div>';

  const { data, error } = await supabase.from('letters').select('*').eq('from_user_id', myUserId).order('created_at', { ascending: false });

  if (error) { console.error('ERRO AO CARREGAR CARTAS ENVIADAS:', error); list.innerHTML = '<div class="letter-empty">Não foi possível carregar 😢</div>'; return; }

  list.innerHTML = '';
  if (!data || !data.length) {
    list.innerHTML = '<div class="letter-empty">Você ainda não escreveu nenhuma carta 💭</div>';
    return;
  }

  data.forEach(letter => {
    const card = document.createElement('div');
    card.className = 'letter-card locked';
    const preview = letter.content.length > 90 ? letter.content.slice(0, 90) + '…' : letter.content;
    card.innerHTML =
      '<div class="letter-top"><span class="letter-badge">' + (letter.opened_at ? '✅ já foi lida' : '🔒 ainda selada') + '</span></div>' +
      '<div class="letter-condition">' + deliveryConditionText(letter) + '</div>' +
      '<div class="letter-preview">' + escapeHtml(preview) + '</div>' +
      '<p class="letter-condition">toque pra ler a carta inteira 👆</p>';

    card.addEventListener('click', (e) => {
      if (e.target.closest('.letter-delete')) return;
      openLetterModal(letter, !!letter.opened_at);
    });

    if (!letter.opened_at) {
      const del = document.createElement('button');
      del.className = 'letter-delete';
      del.textContent = '🗑️ Apagar carta';
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('Apagar essa carta antes dela ser lida?')) return;
        await supabase.from('letters').delete().eq('id', letter.id);
        await loadSentLetters();
      });
      card.appendChild(del);
    }

    list.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('logoutLink').addEventListener('click', async () => {
  await supabase.auth.signOut();
  window.location.href = 'login.html';
});

(async function boot() {
  const { data: sessionData } = await supabase.auth.getSession();
  const session = sessionData && sessionData.session;
  if (!session) { window.location.href = 'login.html'; return; }
  myUserId = session.user.id;

  const { data: profileRow } = await supabase.from('profiles').select('*').eq('user_id', myUserId).maybeSingle();
  if (!profileRow) { window.location.href = 'index.html'; return; }
  myProfile = profileRow;

  Mascotinho.init({ supabase, pairId: myProfile.pair_id });

  const { data: partnerRow } = await supabase.from('profiles').select('*').eq('pair_id', myProfile.pair_id).neq('user_id', myUserId).maybeSingle();
  partnerProfile = partnerRow;

  const { data: myMoodRow } = await supabase.from('mood_state').select('mood').eq('user_id', myUserId).maybeSingle();
  if (myMoodRow && myMoodRow.mood) document.body.className = 'mood-' + myMoodRow.mood;

  await loadInboxLetters();
  await loadSentLetters();
})();
</script>
